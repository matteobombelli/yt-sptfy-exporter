[project]
name = "yt-sptfy-exporter"
version = "0.1.0"
description = "Download Spotify or YouTube playlists as MP3s"
requires-python = ">=3.10"
dependencies = ["yt-dlp", "mutagen"]

[tool.uv]
package = false
# Always pull the newest yt-dlp: old versions get 403s when YouTube changes.
upgrade-package = ["yt-dlp"]
